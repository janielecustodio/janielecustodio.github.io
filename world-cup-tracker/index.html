<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup Tracker — Janiele Custodio</title>
<meta name="description" content="2026 FIFA World Cup tracker — live group standings, knockout bracket, and a simulation mode to predict results from group stage through the final.">
<link rel="canonical" href="https://janielecustodio.com/world-cup-tracker/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* World Cup tracker theme — overridden by My Team palette */
  --color-primary:#0b3d2e;
  --color-secondary:#13734f;
  --color-accent:#ffd166;
  --color-bg:#0a1410;
  --color-card:#0f1e17;
  --color-card2:#13261d;
  --color-border:#1f3a2d;
  --color-text:#e7f3ec;
  --color-muted:#7fa392;
  --color-good:#2ecc71;
  --color-bad:#7a8290;
}
[data-theme="light"]{
  --color-primary:#0b3d2e;
  --color-secondary:#13734f;
  --color-accent:#b8860b;
  --color-bg:#f5f7f5;
  --color-card:#ffffff;
  --color-card2:#eef2ef;
  --color-border:#d8e0db;
  --color-text:#152019;
  --color-muted:#5c6e64;
  --color-good:#1f9d52;
  --color-bad:#9aa0a6;
}
html,body{height:100%}
body{
  background:var(--color-page-bg, var(--color-bg));color:var(--color-text);
  font-family:'IBM Plex Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ── APP SHELL ── */
.content{min-height:100vh;background:var(--color-page-bg, var(--color-bg));color:var(--color-text)}

#wc-root{font-family:'IBM Plex Sans',sans-serif}
.loading-screen{display:flex;align-items:center;justify-content:center;height:100vh;font-size:18px;color:var(--color-muted)}

.wc-app{padding:20px 28px 60px;max-width:1280px}
.wc-topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--color-border)}
.wc-brand{font-size:20px;font-weight:600;color:var(--color-text)}
.wc-live-status{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--color-muted);margin-top:4px}
.refresh-now-btn{font-family:'IBM Plex Mono',monospace;font-size:11px;background:none;border:1px solid var(--color-border);color:var(--color-secondary);border-radius:4px;padding:1px 6px;cursor:pointer}
.refresh-now-btn:hover{border-color:var(--color-secondary)}
.refresh-now-btn:disabled{opacity:.6;cursor:default}
.wc-topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tz-select{
  background:var(--color-card);border:1px solid var(--color-border);
  color:var(--color-text);padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px;max-width:160px;
}
.theme-toggle-btn{
  background:none;border:none;
  color:var(--color-text);width:32px;height:32px;flex-shrink:0;padding:0;
  cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;
}
.theme-toggle-btn:hover{opacity:.75}

/* team selector */
.team-selector{position:relative}
.team-selector-btn{
  display:flex;align-items:center;gap:6px;
  background:var(--color-card);border:1px solid var(--color-border);
  color:var(--color-text);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;max-width:160px;
}
.wc-controls .team-selector-btn{max-width:130px}
.team-selector-btn:hover{border-color:var(--color-secondary)}
.team-selector-btn span:not(.chev){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.flag-icon{width:16px;height:auto;border-radius:2px;flex-shrink:0}
.chev{font-size:10px;opacity:.6;margin-left:4px;flex-shrink:0}
.team-dropdown{
  position:absolute;right:0;top:calc(100% + 6px);width:220px;
  background:var(--color-card2);border:1px solid var(--color-border);
  border-radius:8px;box-shadow:0 12px 28px rgba(0,0,0,.45);z-index:50;overflow:hidden;
}
.team-search{
  width:100%;padding:10px 12px;background:var(--color-card);border:none;
  border-bottom:1px solid var(--color-border);color:var(--color-text);font-size:13px;outline:none;
}
.team-list{max-height:320px;overflow-y:auto}
.team-option{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.team-option:hover{background:var(--color-card)}
.team-option-group{margin-left:auto;font-size:10px;color:var(--color-muted);font-family:'IBM Plex Mono',monospace}
.team-option-name-short{display:none}
.clear-option{color:var(--color-muted);border-bottom:1px solid var(--color-border)}

/* controls */
.wc-controls{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.filter-mode-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.view-tabs,.mode-toggle{display:flex;gap:4px;background:var(--color-card);border:1px solid var(--color-border);border-radius:8px;padding:3px}
.view-tabs button,.mode-toggle button{
  background:none;border:none;color:var(--color-muted);padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;
}
.view-tabs button.active,.mode-toggle button.active{background:var(--color-primary);color:#fff}
.mode-controls{display:flex;align-items:center;gap:10px}
.live-toggle{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--color-muted);cursor:pointer;white-space:nowrap}
.live-toggle input{cursor:pointer;accent-color:var(--color-accent)}
.reset-btn{background:none;border:1px solid var(--color-border);color:var(--color-accent);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.reset-btn:hover{border-color:var(--color-accent)}
.data-banner{background:rgba(255,209,102,.1);border:1px solid var(--color-accent);color:var(--color-accent);padding:8px 14px;border-radius:6px;font-size:12px;margin:0 auto 16px;width:380px;max-width:100%;box-sizing:border-box}
.projected-banner{background:rgba(127,163,146,.1);border-color:var(--color-secondary);color:var(--color-muted)}
.projected-banner strong{color:var(--color-accent)}
.live-badge{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;color:#ff5c5c;letter-spacing:.03em;white-space:nowrap}
.ft-tag{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;color:var(--color-muted);border:1px solid var(--color-border);border-radius:4px;padding:0 4px}
.match-row.is-live{outline:1px solid #ff5c5c}
.empty-state{color:var(--color-muted);font-size:13px;padding:20px 0}

/* group tables */
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-bottom:32px}
.group-table{background:var(--color-card);border:1px solid var(--color-border);border-radius:8px;padding:12px 14px}
.group-table-title{font-weight:600;font-size:13px;margin-bottom:8px;color:var(--color-accent);display:flex;align-items:center;gap:8px}
.group-status{font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--color-muted);border:1px solid var(--color-border);border-radius:4px;padding:1px 6px;font-weight:400}
.group-table table{width:100%;font-size:12px;border-collapse:collapse}
.group-table th{text-align:center;color:var(--color-muted);font-weight:500;padding:4px 2px;font-size:10px}
.group-table th:first-child{text-align:left}
.group-table td{text-align:center;padding:5px 2px;border-top:1px solid var(--color-border);border-left:3px solid transparent}
.group-table td:first-child{text-align:left;font-weight:500}
.group-table td.pts{font-weight:700;color:var(--color-accent)}
.group-table tr.qualified td:first-child,.group-table tr.qualified.projected td:first-child{color:var(--color-accent)}
.group-table tr.qualified td:first-child,.group-table tr.qualified.projected td:first-child{border-left-color:var(--color-accent)}
.group-table tr.qualified,.group-table tr.qualified.projected{background:color-mix(in srgb, var(--color-accent) 14%, transparent)}
.group-table tr.eliminated td:first-child{color:var(--color-bad)}
.group-table tr.is-my-team td:first-child{color:var(--color-accent);font-weight:700;border-left-color:var(--color-accent)}
.group-table tr.is-my-team{background:color-mix(in srgb, var(--color-accent) 22%, transparent)}
.clinched-tag{margin-left:4px;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;font-size:10px;font-weight:700;color:var(--color-bg);background:var(--color-accent);border-radius:50%;vertical-align:middle;flex-shrink:0}
.clinched-legend{font-size:11px;color:var(--color-muted);margin-bottom:10px;display:flex;align-items:center;gap:2px}
.clickable-team{cursor:pointer}
.clickable-team:hover{text-decoration:underline}
.standings-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.standings-modal{position:relative;background:var(--color-card2);border:1px solid var(--color-border);border-radius:10px;padding:18px 16px 16px;width:340px;max-width:100%;box-shadow:0 20px 48px rgba(0,0,0,.5)}
.standings-modal table{width:100%;font-size:12px;border-collapse:collapse;margin-top:8px}
.standings-modal th{text-align:center;color:var(--color-muted);font-weight:500;padding:4px 2px;font-size:10px}
.standings-modal th:first-child{text-align:left}
.standings-modal td{text-align:center;padding:5px 2px;border-top:1px solid var(--color-border)}
.standings-modal td:first-child{text-align:left;font-weight:500}
.standings-modal td.pts{font-weight:700;color:var(--color-accent)}
.standings-modal tr.qualified td:first-child{color:var(--color-accent)}
.standings-modal tr.qualified{background:color-mix(in srgb, var(--color-accent) 14%, transparent)}
.standings-modal tr.eliminated td:first-child{color:var(--color-bad)}
.standings-modal tr.is-selected-team td{box-shadow:inset 0 1px 0 0 var(--color-secondary),inset 0 -1px 0 0 var(--color-secondary)}
.standings-modal tr.is-selected-team td:first-child{box-shadow:inset 0 1px 0 0 var(--color-secondary),inset 0 -1px 0 0 var(--color-secondary),inset 1px 0 0 0 var(--color-secondary)}
.standings-modal tr.is-selected-team td:last-child{box-shadow:inset 0 1px 0 0 var(--color-secondary),inset 0 -1px 0 0 var(--color-secondary),inset -1px 0 0 0 var(--color-secondary)}
.standings-modal-close{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--color-muted);font-size:15px;cursor:pointer;padding:4px}
.standings-modal-close:hover{color:var(--color-text)}
.standings-modal-status{margin-top:12px;font-size:12px;color:var(--color-secondary);font-weight:600;line-height:1.4}
.standings-modal{max-height:85vh;overflow-y:auto}
.standings-modal-matches{margin-top:14px;border-top:1px solid var(--color-border);padding-top:10px;max-height:240px;overflow-y:auto}
.standings-modal-matches-heading{display:flex;align-items:center;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--color-muted);margin-bottom:6px}
.standings-modal-matches-heading:not(:first-child){margin-top:12px}
.standings-modal-past-toggle{background:none;border:1px solid var(--color-border);color:var(--color-secondary);border-radius:5px;padding:3px 7px;font-size:10px;font-family:'IBM Plex Mono',monospace;cursor:pointer;text-transform:none;letter-spacing:0}
.standings-modal-matches .match-row{padding:6px 8px;margin-bottom:6px}
.standings-modal-matches .match-team{font-size:11px}
.standings-modal-matches .venue-line{font-size:9px}

.section-heading{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--color-muted);margin-bottom:14px;border-bottom:1px solid var(--color-border);padding-bottom:8px}
.section-heading.day-nav{display:flex;align-items:center;justify-content:center;gap:10px}
.day-nav-btn{background:none;border:1px solid var(--color-border);color:var(--color-text);width:22px;height:22px;border-radius:4px;cursor:pointer;font-size:13px;line-height:1;padding:0;flex-shrink:0}
.day-nav-btn:hover{border-color:var(--color-secondary)}
.day-nav-today{background:none;border:1px solid var(--color-accent);color:var(--color-accent);border-radius:4px;cursor:pointer;font-size:10px;padding:2px 6px;flex-shrink:0;text-transform:none;letter-spacing:0}
.day-nav-title{background:none;border:none;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;padding:0;display:flex;align-items:center;gap:4px}
.day-nav-title:hover{color:var(--color-accent)}
.day-phase-note{text-align:center;font-size:11px;color:var(--color-secondary);margin:-6px 0 14px;font-weight:600}
.day-picker-backdrop{position:fixed;inset:0;z-index:60}
.day-picker{position:absolute;left:50%;top:80px;transform:translateX(-50%);width:260px;max-height:60vh;overflow-y:auto;background:var(--color-card2);border:1px solid var(--color-border);border-radius:8px;box-shadow:0 12px 28px rgba(0,0,0,.45)}
.day-picker-option{display:flex;flex-direction:column;gap:2px;padding:8px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--color-border)}
.day-picker-option:hover{background:var(--color-card)}
.day-picker-option.active{background:color-mix(in srgb, var(--color-accent) 14%, transparent)}
.day-picker-date{font-family:'IBM Plex Mono',monospace;font-weight:600}
.day-picker-label{color:var(--color-muted);font-size:11px}
.today-view{touch-action:pan-y;position:relative}
.fixtures-section,.today-view{max-width:520px}
.fixture-group{margin-bottom:20px}
.fixture-group-title{font-weight:600;font-size:13px;color:var(--color-secondary);margin-bottom:6px}

/* match row */
.match-row{
  background:var(--color-card);border:1px solid var(--color-border);border-radius:8px;
  padding:10px 14px;margin-bottom:8px;position:relative;
  width:380px;max-width:100%;margin-left:auto;margin-right:auto;
}
.match-row-main{display:grid;grid-template-columns:1fr auto 1fr;justify-content:center;align-items:start;gap:8px}
.goals-toggle-btn{background:none;border:none;color:var(--color-muted);font-size:9px;font-family:'IBM Plex Mono',monospace;cursor:pointer;padding:0;opacity:.8;white-space:nowrap}
.goals-toggle-btn:hover{opacity:1;text-decoration:underline}
.goals-toggle-btn.compact{font-size:12px;opacity:.7;line-height:1}
.goals-toggle-btn.compact.is-open{opacity:1}
.bracket-card .goals-line,.standings-modal-matches .goals-line{font-size:10px}
.goals-line{font-size:11px;color:var(--color-muted);margin-top:4px;display:flex;flex-direction:column;gap:4px;text-align:left}
.goals-line-team{display:flex;align-items:center;gap:6px;text-align:left}
.goals-line-team .match-flag{width:16px}
.goals-team-name{font-weight:600;color:var(--color-secondary)}
.match-row .venue-line{font-size:11px;color:var(--color-muted);display:flex;flex-direction:column;gap:2px;margin-top:4px;font-family:'IBM Plex Mono',monospace}
.venue-line-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.venue-line-spacer{flex:1 1 auto}
.venue-dot{opacity:.5}
.match-group-badge{position:absolute;top:8px;right:10px;font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--color-secondary);font-weight:600}
.match-locked-badge{position:absolute;top:6px;right:8px;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;font-size:10px;font-weight:700;color:var(--color-bg);background:var(--color-good);border-radius:50%}
.match-team{font-size:13px;font-weight:500;color:var(--color-text);text-align:right;display:flex;align-items:center;gap:6px;justify-content:flex-end;overflow:hidden;white-space:nowrap;min-width:0}
.match-team span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.match-team.right{text-align:left;justify-content:flex-start}
.match-flag{width:18px;height:auto;border-radius:2px;flex-shrink:0}
.match-team.qualified{color:var(--color-accent)}
.match-team.eliminated{color:var(--color-bad)}
.match-team.is-my-team{color:var(--color-accent);font-weight:700}
.match-team.tbd{color:var(--color-muted);font-style:italic}
.proj-tag{font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--color-accent);border:1px solid var(--color-accent);border-radius:4px;padding:0 4px;margin-left:6px;font-weight:500;vertical-align:middle}
.match-score{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-weight:700;font-size:14px;width:74px;flex-shrink:0;color:var(--color-text)}
.score-main{min-width:1em}
.match-row.editable .match-score{cursor:pointer}
.match-row.editable .match-score:hover .score-main{color:var(--color-accent)}
.score-edit{display:inline-flex;align-items:center;gap:4px}
.score-edit input{width:34px;background:var(--color-bg);border:1px solid var(--color-border);color:var(--color-text);border-radius:4px;text-align:center;font-size:13px;padding:2px;-moz-appearance:textfield}
.score-edit input::-webkit-outer-spin-button,.score-edit input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.score-edit button{background:var(--color-good);border:none;color:#fff;border-radius:4px;padding:2px 7px;cursor:pointer}

/* bracket */
.bracket-scroll-hint{display:none;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--color-muted);margin-bottom:8px}
.bracket{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:22px;overflow:visible;position:relative}
.bracket-col{min-width:0;position:relative;z-index:1}
.bracket-lines{position:absolute;top:0;left:0;pointer-events:none;z-index:0}
.bracket-line{fill:none;stroke:var(--color-secondary);stroke-width:3;opacity:.55}
.bracket-col-title{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--color-accent);margin-bottom:4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bracket-card-note{font-size:10px;color:var(--color-muted);text-align:center;margin-top:4px}
.bracket-card .match-row{margin-bottom:8px;padding:6px 8px;width:100%}
.bracket-card .match-row-main{grid-template-columns:1fr auto 1fr;gap:4px}
.bracket-card .match-team{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bracket-card .match-score{width:auto;min-width:40px;font-size:12px}
.bracket-card .match-flag{width:14px;flex-shrink:0}
.bracket-card .venue-line{font-size:9px}

@media(max-width:900px){
  .bracket-scroll-hint{display:block}
  .bracket{display:flex;grid-template-columns:none;gap:10px;overflow-x:auto;overflow-y:visible;padding-bottom:8px}
  .bracket-col{min-width:160px;flex-shrink:0}
}

@media(max-width:640px){
  .wc-app{padding:16px}
  .groups-grid{grid-template-columns:1fr}
  .fixtures-section,.today-view{max-width:100%}
  .match-row{width:100%;padding:10px}
  .data-banner{width:100%}
  .match-row-main{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px}
  .match-team{font-size:12px;min-width:0}
  .match-score{width:auto;flex-shrink:0}
  .wc-topbar-right{flex-direction:row;flex-wrap:nowrap;align-items:stretch;width:100%;gap:6px}
  .wc-topbar-right>*{width:auto}
  .wc-topbar-right>.theme-toggle-btn{order:-1}
  .wc-topbar-right>.tz-select{flex:1 1 0;min-width:0;max-width:none}
  .wc-topbar-right>.team-selector{flex:1 1 0;min-width:0}
  .tz-select{font-size:12px;padding:6px 8px;max-width:none}
  .wc-topbar-right .team-selector-btn{width:100%;max-width:none;justify-content:space-between}
  .wc-topbar-right .team-dropdown{left:auto;right:0;width:220px}
  .wc-controls .team-dropdown{left:0;right:auto;width:160px}
  .wc-controls .team-option{padding:7px 8px;font-size:12px;gap:6px}
  .wc-controls .team-option-group{margin-left:4px}
  .wc-controls{gap:6px}
  .wc-controls .team-selector-btn{max-width:96px;padding:6px 7px;font-size:11px}
  .filter-mode-row{gap:6px;flex:1 1 auto}
  .mode-toggle button{padding:6px 8px;font-size:12px}
  .reset-btn{padding:6px 8px;font-size:11px}
  .live-toggle{font-size:11px;gap:3px}
  .mode-controls{gap:6px}
  .team-option-name-full{display:none}
  .team-option-name-short{display:inline}
}
::-webkit-scrollbar{height:6px;width:6px}
::-webkit-scrollbar-track{background:var(--color-bg)}
::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:3px}
</style>
</head>
<body>

<div class="content">
  <div id="wc-root"></div>
</div>

<!-- data + utils -->
<script src="src/constants/teams.js"></script>
<script src="src/constants/venues.js"></script>
<script src="src/constants/fixtureTemplate.js"></script>
<script src="src/utils/standings.js"></script>
<script src="src/utils/bracket.js"></script>
<script src="src/utils/theme.js"></script>
<script src="src/utils/timezone.js"></script>
<script src="src/services/worldcup.js"></script>
<script src="src/services/liveScores.js"></script>

<!-- React + Babel -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script>
// Manually fetch + transpile the JSX sources with the classic runtime
// (the automatic runtime injects an ES `import`, which fails in a plain
// script tag) then execute them as a single global-scope script.
(function () {
  var v = Date.now();
  fetch('src/version.js?v=' + v, { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (src) { (0, eval)(src); })
    .then(function () {
      return Promise.all(['src/App.js', 'src/main.js'].map(function (url) {
        return fetch(url + '?v=' + v, { cache: 'no-store' }).then(function (r) { return r.text(); });
      }));
    })
    .then(function (sources) {
      var code = sources.map(function (src) {
        return Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
      }).join('\n;\n');
      (0, eval)(code);
    });
})();
</script>
</body>
